<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <rect width="700" height="450" fill="#0f172a" rx="10"/>
  <text x="350" y="40" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#0ea5e9" text-anchor="middle">OSI 7 LAYER ARCHITECTURE</text>
  
  <g font-family="monospace" font-size="14" font-weight="bold">
    <!-- Layer 7 -->
    <rect x="50" y="65" width="600" height="40" rx="6" fill="#0284c7"/>
    <text x="70" y="90" fill="#ffffff">Layer 7: Application</text>
    <text x="630" y="90" fill="#e0f2fe" text-anchor="end">HTTP, HTTPS, FTP, SSH</text>

    <!-- Layer 6 -->
    <rect x="50" y="115" width="600" height="40" rx="6" fill="#0369a1"/>
    <text x="70" y="140" fill="#ffffff">Layer 6: Presentation</text>
    <text x="630" y="140" fill="#e0f2fe" text-anchor="end">SSL/TLS, ASCII, JPEG</text>

    <!-- Layer 5 -->
    <rect x="50" y="165" width="600" height="40" rx="6" fill="#075985"/>
    <text x="70" y="190" fill="#ffffff">Layer 5: Session</text>
    <text x="630" y="190" fill="#e0f2fe" text-anchor="end">RPC, NetBIOS, Sockets</text>

    <!-- Layer 4 -->
    <rect x="50" y="215" width="600" height="40" rx="6" fill="#0f766e"/>
    <text x="70" y="240" fill="#ffffff">Layer 4: Transport</text>
    <text x="630" y="240" fill="#ccfbf1" text-anchor="end">TCP, UDP</text>

    <!-- Layer 3 -->
    <rect x="50" y="265" width="600" height="40" rx="6" fill="#115e59"/>
    <text x="70" y="290" fill="#ffffff">Layer 3: Network</text>
    <text x="630" y="290" fill="#ccfbf1" text-anchor="end">IP, ICMP, ARP, BGP</text>

    <!-- Layer 2 -->
    <rect x="50" y="315" width="600" height="40" rx="6" fill="#134e4a"/>
    <text x="70" y="340" fill="#ffffff">Layer 2: Data Link</text>
    <text x="630" y="340" fill="#ccfbf1" text-anchor="end">Ethernet, MAC, Wi-Fi</text>

    <!-- Layer 1 -->
    <rect x="50" y="365" width="600" height="40" rx="6" fill="#064e3b"/>
    <text x="70" y="390" fill="#ffffff">Layer 1: Physical</text>
    <text x="630" y="390" fill="#d1fae5" text-anchor="end">Kabel UTP, Fiber Optic, Radio</text>
  </g>
</svg>
