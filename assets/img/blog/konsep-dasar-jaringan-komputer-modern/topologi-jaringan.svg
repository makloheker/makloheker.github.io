<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="100%" height="100%">
  <rect width="700" height="350" fill="#0f172a" rx="10"/>
  <text x="350" y="35" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#0ea5e9" text-anchor="middle">TOPOLOGI JARINGAN (STAR vs MESH)</text>

  <!-- STAR TOPOLOGY -->
  <g transform="translate(50, 60)">
    <rect width="270" height="250" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="135" y="30" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">Star Topology</text>
    <!-- Center Switch -->
    <rect x="110" y="110" width="50" height="30" rx="4" fill="#0ea5e9"/>
    <text x="135" y="130" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">SW</text>
    <!-- Lines -->
    <line x1="135" y1="110" x2="135" y2="65" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="160" y1="125" x2="220" y2="125" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="135" y1="140" x2="135" y2="195" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="110" y1="125" x2="50" y2="125" stroke="#0ea5e9" stroke-width="2"/>
    <!-- Nodes -->
    <circle cx="135" cy="65" r="14" fill="#0284c7"/>
    <circle cx="220" cy="125" r="14" fill="#0284c7"/>
    <circle cx="135" cy="195" r="14" fill="#0284c7"/>
    <circle cx="50" cy="125" r="14" fill="#0284c7"/>
  </g>

  <!-- MESH TOPOLOGY -->
  <g transform="translate(380, 60)">
    <rect width="270" height="250" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="135" y="30" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">Full Mesh Topology</text>
    <!-- Interconnections -->
    <polygon points="135,65 215,115 185,195 85,195 55,115" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="135" y1="65" x2="185" y2="195" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6"/>
    <line x1="135" y1="65" x2="85" y2="195" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6"/>
    <line x1="55" y1="115" x2="215" y2="115" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6"/>
    <line x1="55" y1="115" x2="185" y2="195" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6"/>
    <line x1="215" y1="115" x2="85" y2="195" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6"/>
    <!-- Nodes -->
    <circle cx="135" cy="65" r="14" fill="#0d9488"/>
    <circle cx="215" cy="115" r="14" fill="#0d9488"/>
    <circle cx="185" cy="195" r="14" fill="#0d9488"/>
    <circle cx="85" cy="195" r="14" fill="#0d9488"/>
    <circle cx="55" cy="115" r="14" fill="#0d9488"/>
  </g>
</svg>
